<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Berichte</title>
  <meta name="description" content="Berichte mit Unterpunkten, Fotos und Sprachnotizen – offline, alles bleibt auf dem Gerät.">
  <meta name="theme-color" content="#3949ab">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Liste der Berichte -->
  <section id="list-view" class="view">
    <header class="bar">
      <h1>Berichte</h1>
      <button id="menu-btn" class="icon-btn" aria-label="Menü" aria-haspopup="true">⋮</button>
    </header>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Berichte durchsuchen" autocomplete="off">
    </div>
    <ul id="reports" class="notes"></ul>
    <p id="empty" class="empty" hidden></p>
    <button id="add-btn" class="fab" aria-label="Neuer Bericht">+</button>
  </section>

  <!-- Bericht bearbeiten -->
  <section id="edit-view" class="view" hidden>
    <header class="bar">
      <button id="back-btn" class="icon-btn" aria-label="Zurück">←</button>
      <h1 id="edit-heading">Bericht</h1>
      <button id="share-btn" class="icon-btn" aria-label="Bericht teilen" title="Bericht teilen">⇪</button>
      <button id="report-menu-btn" class="icon-btn" aria-label="Weitere Aktionen" aria-haspopup="true">⋮</button>
    </header>
    <div class="editor">
      <div id="report-head" class="report-head" data-id="__report">
        <div class="head-row">
          <button id="head-fold" type="button" class="fold-btn" aria-label="Titelbereich ein-/ausklappen" aria-expanded="true">▾</button>
          <input id="r-title" class="title-input" placeholder="Titel des Berichts" autocomplete="off" enterkeyhint="next">
        </div>
        <div id="head-summary" class="head-summary"></div>
        <div class="head-body">
        <label class="date-row">
          <span>Datum</span>
          <input id="r-date" type="date">
        </label>
        <label class="date-row place-row">
          <span>Ort</span>
          <input id="r-place" type="text" placeholder="z. B. Talstation Sölden" autocomplete="off" enterkeyhint="next">
        </label>
        <label class="date-row place-row people-row">
          <span>Teilnehmer</span>
          <textarea id="r-people" class="autogrow" rows="1" placeholder="z. B. Müller, Huber, Gruber"></textarea>
        </label>
        <textarea id="r-notes" class="autogrow notes-input" rows="2" placeholder="Notizen zum Bericht …"></textarea>
        <div class="photos" hidden></div>
        <div class="audios" hidden></div>
        </div>
      </div>

      <h2 class="section-title">
        <button id="fold-all" class="section-toggle" type="button" aria-expanded="true">
          <span class="arrow" aria-hidden="true">▾</span> Unterpunkte <span id="item-count" class="count"></span>
        </button>
      </h2>
      <div id="items"></div>
      <button id="add-item" class="add-item" type="button">+ Unterpunkt hinzufügen</button>
      <p id="r-updated" class="date"></p>
    </div>
    <footer id="recording" class="toolbar" hidden>
      <div class="recording">
        <span class="rec-dot" aria-hidden="true"></span>
        <span id="rec-label" class="rec-label">Aufnahme</span>
        <span id="rec-time">0:00</span>
        <button id="rec-cancel" class="tool-btn" type="button">Verwerfen</button>
        <button id="rec-stop" class="tool-btn primary" type="button">■ Fertig</button>
      </div>
    </footer>
  </section>

  <!-- Foto-Ansicht -->
  <div id="viewer" class="viewer" hidden>
    <img id="viewer-img" alt="">
    <div class="viewer-bar">
      <button id="viewer-close" class="icon-btn" aria-label="Schließen">✕</button>
      <span class="spacer"></span>
      <button id="viewer-share" class="icon-btn" aria-label="Teilen" title="Teilen">⇪</button>
      <button id="viewer-save" class="icon-btn" aria-label="Speichern" title="Als Datei speichern">⤓</button>
      <button id="viewer-delete" class="icon-btn" aria-label="Foto löschen" title="Löschen">🗑</button>
    </div>
    <div class="viewer-caption">
      <textarea id="viewer-comment" rows="1" placeholder="💬 Kommentar zum Foto …" aria-label="Kommentar zum Foto"></textarea>
    </div>
  </div>

  <!-- Menüs -->
  <div id="main-menu" class="menu" hidden role="menu">
    <button data-action="export-all" role="menuitem">Sicherung exportieren (alle Berichte)</button>
    <button data-action="import" role="menuitem">Sicherung importieren</button>
    <button data-action="onedrive-setup" role="menuitem">OneDrive einrichten …</button>
    <p id="backup-info" class="menu-info"></p>
  </div>
  <div id="report-menu" class="menu" hidden role="menu">
    <button data-action="export-html" role="menuitem">Bericht als Datei speichern (HTML)</button>
    <button data-action="share-report" role="menuitem">Bericht teilen</button>
    <button data-action="print" role="menuitem">Drucken / als PDF speichern</button>
    <button data-action="delete-report" role="menuitem" class="danger">Bericht löschen</button>
  </div>
  <div id="item-menu" class="menu" hidden role="menu">
    <button data-action="item-up" role="menuitem">↑ Nach oben</button>
    <button data-action="item-down" role="menuitem">↓ Nach unten</button>
    <button data-action="item-delete" role="menuitem" class="danger">Unterpunkt löschen</button>
  </div>

  <input id="camera-file" type="file" accept="image/*" capture="environment" hidden>
  <input id="photo-file" type="file" accept="image/*" multiple hidden>
  <input id="import-file" type="file" accept=".json,.txt,application/json,text/plain" multiple hidden>
  <!-- Wohin soll die Sicherung? -->
  <dialog id="save-dialog" class="save-dialog">
    <h3>Sicherung speichern</h3>
    <p id="save-info" class="save-info"></p>
    <button type="button" data-save="onedrive">☁️ In OneDrive sichern</button>
    <button type="button" data-save="picker">📁 Speicherort wählen …</button>
    <button type="button" data-save="share">📤 Teilen (Drive, Mail, Dateien …)</button>
    <button type="button" data-save="download">⤓ In „Downloads“ speichern</button>
    <button type="button" data-save="cancel" class="cancel">Abbrechen</button>
  </dialog>

  <!-- OneDrive einrichten -->
  <dialog id="od-dialog" class="save-dialog od-dialog">
    <h3>OneDrive einrichten</h3>
    <p class="save-info">Für die direkte Sicherung braucht die App eine einmalige Registrierung bei Microsoft
      (Azure / Entra ID). Die Anleitung steht in der README von MyNotes.</p>
    <label class="od-field">
      <span>Anwendungs-ID (Client-ID)</span>
      <input id="od-client" type="text" autocomplete="off" spellcheck="false" placeholder="z. B. 1a2b3c4d-…">
    </label>
    <label class="od-field">
      <span>Verzeichnis-ID (Tenant) – nur für Firmenkonten, sonst leer</span>
      <input id="od-tenant" type="text" autocomplete="off" spellcheck="false" placeholder="common">
    </label>
    <label class="od-field">
      <span>Ordner in OneDrive</span>
      <input id="od-folder" type="text" autocomplete="off" spellcheck="false" placeholder="Berichte-Sicherungen">
    </label>
    <p id="od-status" class="save-info"></p>
    <button type="button" data-od="save">Speichern</button>
    <button type="button" data-od="logout">Von OneDrive abmelden</button>
    <button type="button" data-od="cancel" class="cancel">Schließen</button>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
